services:
  db:
    image: postgres:16-alpine
    container_name: carwash-leads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carwash
      POSTGRES_PASSWORD: carwash
      POSTGRES_DB: carwash_leads
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwash -d carwash_leads"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
